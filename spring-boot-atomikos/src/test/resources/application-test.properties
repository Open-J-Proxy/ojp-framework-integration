# Placeholder properties - will be overridden in tests with Testcontainers
spring.datasource.postgres.url=jdbc:ojp[localhost:1059(postgres)]_postgresql://localhost:5432/accountsdb
spring.datasource.postgres.username=test
spring.datasource.postgres.password=test
spring.datasource.postgres.driver-class-name=org.openjproxy.jdbc.Driver

spring.datasource.postgres2.url=jdbc:ojp[localhost:1059(postgres2)]_postgresql://localhost:5433/auditdb
spring.datasource.postgres2.username=test
spring.datasource.postgres2.password=test
spring.datasource.postgres2.driver-class-name=org.openjproxy.jdbc.Driver

# Disable SQL initialization
spring.sql.init.mode=never

# JTA settings
//TODO need to add all these properties in ojp.
spring.jta.enabled=true
spring.jta.atomikos.properties.default-jta-timeout=30000
spring.jta.atomikos.properties.max-timeout=60000
spring.jta.atomikos.properties.enable-logging=false
spring.jta.atomikos.properties.recovery.delay=30000
spring.jta.atomikos.properties.recovery.forget-orphaned-log-entries-delay=60000
spring.jta.atomikos.datasource.min-pool-size=5
spring.jta.atomikos.datasource.max-pool-size=20

# Logging
logging.level.root=ERROR
logging.level.com.example.atomikos=DEBUG
logging.level.com.atomikos=DEBUG
