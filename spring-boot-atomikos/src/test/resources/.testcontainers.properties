# TestContainers configuration for CI environment
# Disable Docker Desktop strategy that causes NPE in GitHub Actions CI
# GitHub Actions uses Docker Engine (not Docker Desktop), which is accessed via Unix socket
docker.client.strategy=org.testcontainers.dockerclient.UnixSocketClientProviderStrategy
# Force re-evaluation of Docker environment
checks.disable=false
# Enable Ryuk container for cleanup
ryuk.container.image=testcontainers/ryuk:0.11.0
