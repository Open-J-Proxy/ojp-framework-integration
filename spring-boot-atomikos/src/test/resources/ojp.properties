# Named pool settings for each datasource (pool name embedded in JDBC URL via parentheses).
# These use the <pool-name>.ojp.* prefix, which is not covered by OjpSystemPropertiesBridge
# (it only handles keys starting with "ojp."). They must remain here so the OJP driver can
# read them directly from the classpath.

# Postgres datasource
postgres.ojp.connection.pool.maximumPoolSize=25
postgres.ojp.connection.pool.minimumIdle=5
postgres.ojp.connection.pool.connectionTimeout=2000

# Postgres 2 datasource
postgres2.ojp.connection.pool.maximumPoolSize=50
postgres2.ojp.connection.pool.minimumIdle=10
postgres2.ojp.connection.pool.connectionTimeout=5000