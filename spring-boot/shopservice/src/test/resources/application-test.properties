spring.application.name=shop-service-application

### Catalog Datasource Config (high-performance ojp datasource) ###
spring.datasource.catalog.url=jdbc:ojp[localhost:1059(high-performance),localhost:1060(high-performance),localhost:1061(high-performance)]_h2:mem:catalog_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.catalog.username=sa
spring.datasource.catalog.password=
spring.datasource.catalog.driver-class-name=org.openjproxy.jdbc.Driver
spring.datasource.catalog.type=org.springframework.jdbc.datasource.SimpleDriverDataSource
spring.jpa.catalog.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.catalog.properties.hibernate.hbm2ddl.auto=none


### Checkout Datasource Config (default ojp datasource) ###
spring.datasource.checkout.url=jdbc:ojp[localhost:1059,localhost:1060,localhost:1061]_h2:mem:checkout_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.checkout.username=sa
spring.datasource.checkout.password=
spring.datasource.checkout.driver-class-name=org.openjproxy.jdbc.Driver
spring.datasource.checkout.type=org.springframework.jdbc.datasource.SimpleDriverDataSource
spring.jpa.checkout.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.checkout.properties.hibernate.hbm2ddl.auto=none


#### Global Config ###
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- This configuration is for run sql script --- #
spring.sql.init.mode=never
# Test schema is initialized by SqlInitConfig to avoid OJP multinode H2 schema races during Hibernate create-drop
