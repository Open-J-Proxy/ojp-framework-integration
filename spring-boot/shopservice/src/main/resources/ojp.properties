# Named pool settings for the high-performance datasource (pool name embedded in JDBC URL).
# Default pool settings (ojp.connection.pool.*) are declared in application.properties and
# forwarded to the OJP driver via OjpSystemPropertiesBridge.
# Named pool settings use the <pool-name>.ojp.* prefix which is not covered by the bridge
# and must remain here so the OJP driver can read them directly from the classpath.
high-performance.ojp.connection.pool.maximumPoolSize=50
high-performance.ojp.connection.pool.minimumIdle=10
high-performance.ojp.connection.pool.connectionTimeout=5000
