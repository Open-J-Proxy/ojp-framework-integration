# Placeholder properties - will be overridden in tests with Testcontainers
spring.datasource.postgres.url=jdbc:ojp[localhost:1059,localhost:1060,localhost:1061(postgres)]_postgresql://localhost:5432/accountsdb
spring.datasource.postgres.username=test
spring.datasource.postgres.password=test
spring.datasource.postgres.driver-class-name=org.openjproxy.jdbc.Driver

spring.datasource.postgres2.url=jdbc:ojp[localhost:1059,localhost:1060,localhost:1061(postgres2)]_postgresql://localhost:5433/auditdb
spring.datasource.postgres2.username=test
spring.datasource.postgres2.password=test
spring.datasource.postgres2.driver-class-name=org.openjproxy.jdbc.Driver

# Disable SQL initialization
spring.sql.init.mode=never

# JTA settings for Narayana
spring.jta.enabled=true
spring.jta.narayana.transaction-manager-id=narayanaTransactionManager
spring.jta.narayana.default-timeout=60

# Logging
logging.level.root=ERROR
logging.level.com.example.narayana=DEBUG
logging.level.com.arjuna=DEBUG

# OJP server-side connection pool settings for the postgres datasource (pool name embedded in JDBC URL)
postgres.ojp.connection.pool.maximum-pool-size=25
postgres.ojp.connection.pool.minimum-idle=5
postgres.ojp.connection.pool.connection-timeout=2000

# OJP server-side connection pool settings for the postgres2 datasource (pool name embedded in JDBC URL)
postgres2.ojp.connection.pool.maximum-pool-size=50
postgres2.ojp.connection.pool.minimum-idle=10
postgres2.ojp.connection.pool.connection-timeout=5000
