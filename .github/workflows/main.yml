name: Java Frameworks Integration Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches: [ main ]
  repository_dispatch:
    types: [ojp-updated]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout shopservice code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout OJP repository
        uses: actions/checkout@v4
        with:
          repository: Open-JDBC-Proxy/ojp
          fetch-depth: 0
          ref: main
          path: ojp

      - name: Set up JDK 22
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '22'

      # Check Docker availability for TestContainers-based tests
      - name: Check Docker environment
        run: |
          echo "=== Docker Version ==="
          docker --version || echo "Docker command not found"
          echo ""
          echo "=== Docker Info ==="
          docker info || echo "Docker info failed"
          echo ""
          echo "=== Docker Compose Version ==="
          docker-compose --version || echo "Docker Compose not found"

      # Clean Maven repository to avoid stale ojp artifacts
      - name: Clean ojp artifacts from local Maven repository
        run: |
          rm -rf ~/.m2/repository/org/openjproxy/ojp-jdbc-driver
          rm -rf ~/.m2/repository/org/openjproxy/spring-boot-starter-ojp

      # Build and install ojp-jdbc-driver with integration test SNAPSHOT version
      # This version will be used by all frameworks (Spring Boot, Quarkus, Micronaut)
      - name: Set ojp-jdbc-driver version to SNAPSHOT
        run: |
          mvn versions:set -DnewVersion=0.0.1-SNAPSHOT-INT-TEST-TMP-VERSION -pl ojp-jdbc-driver -DgenerateBackupPoms=false
        working-directory: ojp

      - name: Build and install ojp-jdbc-driver with SNAPSHOT version
        run: mvn clean install -U -pl ojp-jdbc-driver -am -DskipTests
        working-directory: ojp

      # Build and install spring-boot-starter-ojp with integration test SNAPSHOT version
      - name: Set spring-boot-starter-ojp version to SNAPSHOT
        run: |
          mvn versions:set -DnewVersion=0.0.1-SNAPSHOT-INT-TEST-TMP-VERSION -pl spring-boot-starter-ojp -DgenerateBackupPoms=false
          python3 -c "
          import re, sys
          f = 'spring-boot-starter-ojp/pom.xml'
          c = open(f).read()
          updated = re.sub(r'(<artifactId>ojp-jdbc-driver<\/artifactId>\s*<version>)[^<]*(<\/version>)', r'\g<1>0.0.1-SNAPSHOT-INT-TEST-TMP-VERSION\2', c)
          if updated == c:
              print('ERROR: ojp-jdbc-driver version not updated in spring-boot-starter-ojp/pom.xml', file=sys.stderr)
              sys.exit(1)
          open(f, 'w').write(updated)
          print('Successfully updated ojp-jdbc-driver dependency version in spring-boot-starter-ojp/pom.xml')
          "
          # Downgrade spring-boot.version from 4.x to 3.2.6 to match the integration-test apps,
          # and remove spring-boot-jdbc (a Spring Boot 4.x-only artifact) so the starter
          # can be compiled and loaded without ClassNotFoundException at runtime.
          python3 -c "
          import re, sys
          f = 'spring-boot-starter-ojp/pom.xml'
          c = open(f).read()
          # Change spring-boot.version to 3.2.6
          updated = re.sub(r'<spring-boot\.version>[^<]+</spring-boot\.version>', '<spring-boot.version>3.2.6</spring-boot.version>', c)
          if updated == c:
              print('ERROR: spring-boot.version not found in spring-boot-starter-ojp/pom.xml', file=sys.stderr)
              sys.exit(1)
          # Remove the spring-boot-jdbc dependency block (does not exist in Spring Boot 3.x)
          updated = re.sub(r'\s*<dependency>\s*<groupId>org\.springframework\.boot</groupId>\s*<artifactId>spring-boot-jdbc</artifactId>\s*<version>[^<]*</version>\s*<scope>provided</scope>\s*</dependency>', '', updated, flags=re.DOTALL)
          open(f, 'w').write(updated)
          print('Successfully downgraded spring-boot.version to 3.2.6 and removed spring-boot-jdbc dependency')
          "
          # Patch OjpEnvironmentPostProcessor to use the Spring Boot 3.x EnvironmentPostProcessor
          # location (org.springframework.boot.env) instead of the 4.x location
          # (org.springframework.boot). The compiled class must implement the interface that
          # Spring Boot 3.x can resolve; otherwise a NoClassDefFoundError occurs at startup.
          python3 -c "
          import re, sys
          f = 'spring-boot-starter-ojp/src/main/java/org/openjproxy/autoconfigure/OjpEnvironmentPostProcessor.java'
          c = open(f).read()
          updated = re.sub(
              r'import\s+org\.springframework\.boot\.EnvironmentPostProcessor\s*;',
              'import org.springframework.boot.env.EnvironmentPostProcessor;',
              c
          )
          if updated == c:
              print('ERROR: EnvironmentPostProcessor import not updated in OjpEnvironmentPostProcessor.java', file=sys.stderr)
              sys.exit(1)
          open(f, 'w').write(updated)
          print('Successfully updated OjpEnvironmentPostProcessor import for Spring Boot 3.x compatibility')
          "
        working-directory: ojp

      - name: Build and install spring-boot-starter-ojp with SNAPSHOT version
        run: mvn clean install -U -pl spring-boot-starter-ojp -am -DskipTests
        working-directory: ojp

      # Install remaining ojp modules
      - name: Install remaining ojp modules
        run: mvn clean install -U -DskipTests
        working-directory: ojp

      # Download JDBC drivers required by OJP server
      - name: Download JDBC drivers
        run: bash ojp-server/download-drivers.sh
        working-directory: ojp

      - name: Clear previous OJP server logs
        run: rm -f /tmp/ojp-server.log
        working-directory: ojp

      - name: Run (ojp-server)
        run: mvn verify -pl ojp-server -U -Prun-ojp-server -DskipTests > /tmp/ojp-server.log 2>&1 &
        working-directory: ojp

      - name: Wait for ojp-server to start
        run: sleep 10

      - name: Run OJP Spring Boot Integration tests (shopservice)
        run: mvn clean verify
        working-directory: spring-boot/shopservice

      - name: Run OJP Quarkus Integration tests (shopservice)
        run: mvn clean verify
        working-directory: quarkus/shopservice

      - name: Run OJP Micronaut Integration tests (shopservice)
        run: mvn clean verify
        working-directory: micronaut/shopservice

      - name: Run OJP Spring Boot with Atomikos Integration tests
        run: mvn clean verify
        working-directory: spring-boot-atomikos

      - name: Run OJP Spring Boot with Narayana Integration tests
        run: mvn clean verify
        working-directory: spring-boot-narayana

      - name: Show ojp-server.log
        if: always()  # ensures it runs even if previous steps fail
        run: cat /tmp/ojp-server.log || echo "/tmp/ojp-server.log not found"
