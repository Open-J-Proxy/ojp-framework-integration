name: Spring Boot/Micronaut/Quarkus Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  repository_dispatch:
    types: [ ojp-updated ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Use a temp Maven repository so each run downloads fresh libs (no stale cache).
    env:
      MAVEN_OPTS: "-Dmaven.repo.local=${{ runner.temp }}/m2"
      OJP_SNAPSHOT_VER: "0.0.1-SNAPSHOT-INT-TEST-TMP-VERSION"

    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout OJP repository
        uses: actions/checkout@v4
        with:
          repository: Open-JDBC-Proxy/ojp
          fetch-depth: 0
          ref: main
          path: ojp

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
          # Intentionally NOT caching Maven to guarantee fresh downloads

      # Make sure no stale OJP artifacts get picked up
      - name: Purge local OJP artifacts (defense in depth)
        run: |
          rm -rf ~/.m2/repository/org/openjproxy || true
          rm -rf "$RUNNER_TEMP/m2/org/openjproxy" || true

      - name: Set OJP driver version to snapshot used in integration
        working-directory: ojp
        run: |
          mvn -U -B versions:set \
            -DnewVersion="${OJP_SNAPSHOT_VER}" \
            -pl ojp-jdbc-driver \
            -DgenerateBackupPoms=false

      - name: Build and install OJP driver (and deps) with snapshot
        working-directory: ojp
        run: |
          mvn -U -B clean install \
            -pl ojp-jdbc-driver -am \
            -DskipTests

      - name: Build/Install remaining OJP modules (no tests)
        working-directory: ojp
        run: mvn -U -B clean install -DskipTests

      - name: Start OJP server
        working-directory: ojp
        run: |
          # Start in background and log to file
          (mvn -B verify -pl ojp-server -Prun-ojp-server > "$GITHUB_WORKSPACE/ojp-server.log" 2>&1 & echo $! > ojp-server.pid)

      - name: Wait for OJP server to become healthy
        shell: bash
        run: |
          # Try to detect a ready endpoint if available; fall back to port probe.
          # Adjust URL/port if your server differs.
          set -e
          URL="http://127.0.0.1:8080/actuator/health"
          for i in {1..60}; do
            if curl -fsS "$URL" > /dev/null 2>&1; then
              echo "OJP server is up."
              exit 0
            fi
            # Fallback: port check
            if (command -v nc >/dev/null 2>&1 && nc -z 127.0.0.1 8080) || (ss -ltn '( sport = :8080 )' | grep -q 8080); then
              echo "Port 8080 is listening."
              exit 0
            fi
            sleep 2
          done
          echo "OJP server did not become ready in time. Dumping last 200 log lines:" >&2
          tail -n 200 "$GITHUB_WORKSPACE/ojp-server.log" || true
          exit 1

      - name: Run all framework integration tests (DRY loop)
        shell: bash
        run: |
          set -euo pipefail
          declare -a MODULES=(
            "spring-boot/shopservice"
            "quarkus/shopservice"
            "micronaut/shopservice"
            "spring-boot-atomikos"
          )

          status=0
          for m in "${MODULES[@]}"; do
            echo "=== Running mvn verify in $m ==="
            # -U ensures snapshot/plugins are rechecked; -fae to continue after failures and collect them
            if ! mvn -U -B -fae clean verify -f "$m/pom.xml"; then
              echo "Module failed: $m"
              status=1
            fi
          done

          exit $status

      - name: Upload OJP server logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ojp-server-log
          path: ojp-server.log
          if-no-files-found: warn

      - name: Stop OJP server (always)
        if: always()
        working-directory: ojp
        run: |
          if [[ -f ojp-server.pid ]]; then
            kill "$(cat ojp-server.pid)" 2>/dev/null || true
          fi
