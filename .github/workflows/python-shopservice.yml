name: Python SQLAlchemy ShopService Integration Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches: [ main ]
  repository_dispatch:
    types: [ojp-updated]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DB_HOST: localhost
      DB_PORT: '1433'
      DB_USER: sa
      ODBC_DRIVER: ODBC Driver 18 for SQL Server
      CATALOG_DB: py_catalog_db
      CHECKOUT_DB: py_checkout_db
    steps:
      - name: Checkout shopservice code
        uses: actions/checkout@v5

      # Check Docker availability for the SQL Server container
      - name: Check Docker environment
        run: |
          echo "=== Docker Version ==="
          docker --version || echo "Docker command not found"
          echo ""
          echo "=== Docker Info ==="
          docker info || echo "Docker info failed"

      # This first version connects directly to SQL Server through SQLAlchemy + pyodbc (no OJP).
      - name: Start SQL Server 2022
        run: |
          DB_PASSWORD="Py_$(openssl rand -hex 16)_Aa1!"
          echo "::add-mask::$DB_PASSWORD"
          echo "DB_PASSWORD=$DB_PASSWORD" >> "$GITHUB_ENV"
          docker run -d --name python-shopservice-mssql \
            -e ACCEPT_EULA=Y \
            -e "MSSQL_SA_PASSWORD=$DB_PASSWORD" \
            -p 1433:1433 \
            mcr.microsoft.com/mssql/server:2022-latest

      - name: Install Microsoft ODBC Driver 18 for SQL Server
        run: |
          sudo apt-get update
          if ! apt-cache policy msodbcsql18 | grep -q 'Candidate: [0-9]'; then
            curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor --yes -o /usr/share/keyrings/microsoft-prod.gpg
            curl -fsSL "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list" | sudo tee /etc/apt/sources.list.d/mssql-release.list
            sudo apt-get update
          fi
          sudo ACCEPT_EULA=Y DEBIAN_FRONTEND=noninteractive apt-get install -y unixodbc msodbcsql18
          odbcinst -q -d

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/shopservice/pyproject.toml

      - name: Install Python shopservice
        run: python -m pip install -e ".[test]"
        working-directory: python/shopservice

      - name: Wait for SQL Server to accept connections
        run: |
          for i in $(seq 1 60); do
            if docker exec python-shopservice-mssql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$DB_PASSWORD" -Q "SELECT 1" > /dev/null 2>&1; then
              echo "SQL Server is ready"
              exit 0
            fi
            sleep 2
          done
          echo "SQL Server did not become ready in time"
          exit 1

      - name: Run Python Integration tests (shopservice)
        run: python -m pytest -v
        working-directory: python/shopservice

      - name: Show SQL Server logs
        if: always()
        run: docker logs python-shopservice-mssql || echo "SQL Server container not found"

      - name: Stop SQL Server
        if: always()
        run: docker rm -f python-shopservice-mssql || true
