[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ojp-django-shopservice"
version = "0.1.0"
description = "Django shopservice using PostgreSQL through the OJP ODBC driver"
requires-python = ">=3.10"
dependencies = [
    "Django==5.2.18",
    "pyodbc==5.3.0",
    "mssql-django==1.7.2",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
include = ["shopservice*", "catalog*", "checkout*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires both pre-provisioned PostgreSQL databases and OJP"]
